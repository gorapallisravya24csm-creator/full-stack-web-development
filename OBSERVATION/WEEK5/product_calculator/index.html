<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Product Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Interactive Product Calculator</h1>
        </header>
        <main class="calculator-layout">
            <!-- Product Input Form -->
            <section class="card form-card">
                <h2>Product Details</h2>
                <form id="productForm" onsubmit="return false;">
                    <div class="form-group">
                        <label for="productName">Product Name</label>
                        <input type="text" id="productName" placeholder="e.g. Ergonomic Keyboard" value="Wireless Gaming Mouse">
                        <span class="error-msg" id="nameError"></span>
                    </div>
                    <div class="form-group">
                        <label for="productPrice">Unit Price (₹)</label>
                        <input type="number" id="productPrice" placeholder="0.00" min="0" step="0.01" value="1499.00">
                        <span class="error-msg" id="priceError"></span>
                    </div>
                    <div class="form-group">
                        <label for="productQuantity">Quantity</label>
                        <input type="number" id="productQuantity" placeholder="1" min="1" step="1" value="2">
                        <span class="error-msg" id="qtyError"></span>
                    </div>
                    <div class="preset-section">
                        <label class="preset-label">Quick Presets:</label>
                        <div class="preset-buttons">
                            <button type="button" class="preset-btn" data-name="Mechanical Keyboard" data-price="3499.00" data-qty="1">Keyboard</button>
                            <button type="button" class="preset-btn" data-name="Wireless Mouse" data-price="1499.00" data-qty="2">Mouse</button>
                            <button type="button" class="preset-btn" data-name="USB-C Hub" data-price="2750.00" data-qty="3">USB Hub</button>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="button" id="resetBtn" class="btn btn-secondary">Reset Form</button>
                    </div>
                </form>
            </section>
            <!-- Dynamic Invoice Summary Card -->
            <section class="card summary-card">
                <h2>Live Invoice Summary</h2>
                <div class="invoice-details">
                    <div class="summary-row">
                        <span class="label">Product Name:</span>
                        <span class="value" id="summaryName">Wireless Gaming Mouse</span>
                    </div>
                    <div class="summary-row">
                        <span class="label">Unit Price:</span>
                        <span class="value" id="summaryPrice">₹1,499.00</span>
                    </div>
                    <div class="summary-row">
                        <span class="label">Quantity:</span>
                        <span class="value" id="summaryQuantity">2</span>
                    </div>
                    <div class="summary-row">
                        <span class="label">Subtotal:</span>
                        <span class="value" id="summarySubtotal">₹2,998.00</span>
                    </div>
                    <div class="summary-row">
                        <span class="label">GST (18%):</span>
                        <span class="value" id="summaryTax">₹539.64</span>
                    </div>
                    <hr class="divider">
                    <div class="summary-row total-row">
                        <span class="label">Grand Total:</span>
                        <span class="value total-amount" id="summaryTotal">₹3,537.64</span>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
