<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 40px;
        }

        .container {
            background: white;
            width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 25px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #profile {
            margin-top: 20px;
            padding: 20px;
            background-color: #e8f4ff;
            border: 2px solid #007bff;
            border-radius: 10px;
            text-align: left;
        }

        #profile h2 {
            text-align: center;
            color: #007bff;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Student Profile</h1>

        <input type="text" id="name" placeholder="Enter Name">
        <input type="text" id="roll" placeholder="Enter Roll Number">
        <input type="text" id="department" placeholder="Enter Department">
        <input type="number" id="cgpa" step="0.01" placeholder="Enter CGPA">

        <br><br>

        <button id="displayBtn">Display Profile</button>

        <div id="profile"></div>
    </div>

    <script>

        // Creating Student class
        class Student {

            constructor(name, rollNumber, department, cgpa) {
                this.name = name;
                this.rollNumber = rollNumber;
                this.department = department;
                this.cgpa = cgpa;
            }

        }

        // Event handling
        document.getElementById("displayBtn").addEventListener("click", function () {

            // Get user input
            let name = document.getElementById("name").value;
            let roll = document.getElementById("roll").value;
            let department = document.getElementById("department").value;
            let cgpa = document.getElementById("cgpa").value;

            // Create Student object
            let student = new Student(name, roll, department, cgpa);

            // Select profile div
            let profile = document.getElementById("profile");

            // Clear previous profile
            profile.innerHTML = "";

            // Create elements dynamically
            let heading = document.createElement("h2");
            heading.textContent = "Student Profile";

            let namePara = document.createElement("p");
            namePara.textContent = "Name       : " + student.name;

            let rollPara = document.createElement("p");
            rollPara.textContent = "Roll No    : " + student.rollNumber;

            let deptPara = document.createElement("p");
            deptPara.textContent = "Department : " + student.department;

            let cgpaPara = document.createElement("p");
            cgpaPara.textContent = "CGPA       : " + student.cgpa;

            // Add elements to webpage
            profile.appendChild(heading);
            profile.appendChild(namePara);
            profile.appendChild(rollPara);
            profile.appendChild(deptPara);
            profile.appendChild(cgpaPara);
        });

    </script>

</body>
</html>
